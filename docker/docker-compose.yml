# =============================================================================
# docker-compose.yml - ClinicaOdontologica (Spring Boot, BD en MariaDB de WSL)
# =============================================================================
# La base de datos corre nativamente en el WSL (MariaDB, localhost:3306).
# Este compose levanta SOLO la app, conectada a esa BD via host.docker.internal.
# Uso:  docker compose -f docker/docker-compose.yml up -d app
#       docker compose -f docker/docker-compose.yml down
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: clinica-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/clinica_odontologica
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
