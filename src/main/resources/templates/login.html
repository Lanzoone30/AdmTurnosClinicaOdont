<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>

<body class="login-page">

    <main class="login-card">
        <div class="login-brand">
            <span class="brand-icon"><i class="fas fa-tooth"></i></span>
            <h1>Consultorio Odontológico</h1>
            <p>Sistema de Administración de Turnos</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error" role="alert">
            <i class="fas fa-exclamation-circle"></i>
            <span>Usuario o contraseña incorrectos.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label class="field-label" for="username">Usuario</label>
                <input class="input" type="text" id="username" name="username"
                    placeholder="Ingrese su usuario" autocomplete="username" autofocus required>
            </div>

            <div class="field">
                <label class="field-label" for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password"
                    placeholder="Ingrese su contraseña" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
        </form>
    </main>

</body>
</html>
