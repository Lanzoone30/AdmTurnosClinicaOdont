<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${idiomaActual}" lang="es">
<head th:replace="~{fragments/layout :: head(#{odontologo.titulo.alta})}"></head>

<body class="app">

    <a class="skip-link" href="#main" th:text="#{a11y.saltar-contenido}">Saltar al contenido principal</a>

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content" id="main">
            <h1 class="page-title"
                th:text="${odontologo.id == null ? #messages.msg('odontologo.titulo.alta') : #messages.msg('odontologo.titulo.edicion')}">
                Alta Odontólogos</h1>
            <p class="page-subtitle" th:text="#{odontologo.subtitulo.alta}">Complete los datos del odontólogo.</p>

            <div class="panel">
                <div class="panel-body">
                    <form th:object="${odontologo}"
                        th:action="${odontologo.id == null} ? @{/odontologos/nuevo} : @{/odontologos/editar/{id}(id=${odontologo.id})}"
                        method="post">
                        <div class="form-grid">
                            <div class="field">
                                <label class="field-label" for="dni" th:text="#{common.dni}">DNI</label>
                                <input class="input" type="text" id="dni" name="dni"
                                    th:value="*{dni}" th:placeholder="#{paciente.placeholder.dni}" placeholder="Ej: 30.123.456" required
                                    th:attr="aria-describedby=${#fields.hasErrors('dni')} ? 'error-dni' : null,
                                        aria-invalid=${#fields.hasErrors('dni')} ? 'true' : null">
                                <p th:replace="~{fragments/layout :: fieldError('dni')}"></p>
                            </div>
                            <div class="field">
                                <label class="field-label" for="nombre" th:text="#{common.nombre}">Nombre</label>
                                <input class="input" type="text" id="nombre" name="nombre"
                                    th:value="*{nombre}" th:placeholder="#{common.nombre}" placeholder="Nombre" required
                                    th:attr="aria-describedby=${#fields.hasErrors('nombre')} ? 'error-nombre' : null,
                                        aria-invalid=${#fields.hasErrors('nombre')} ? 'true' : null">
                                <p th:replace="~{fragments/layout :: fieldError('nombre')}"></p>
                            </div>
                            <div class="field">
                                <label class="field-label" for="apellido" th:text="#{common.apellido}">Apellido</label>
                                <input class="input" type="text" id="apellido" name="apellido"
                                    th:value="*{apellido}" th:placeholder="#{common.apellido}" placeholder="Apellido" required
                                    th:attr="aria-describedby=${#fields.hasErrors('apellido')} ? 'error-apellido' : null,
                                        aria-invalid=${#fields.hasErrors('apellido')} ? 'true' : null">
                                <p th:replace="~{fragments/layout :: fieldError('apellido')}"></p>
                            </div>
                            <div class="field">
                                <label class="field-label" for="telefono" th:text="#{common.telefono}">Teléfono</label>
                                <input class="input" type="text" id="telefono" name="telefono"
                                    th:value="*{telefono}" th:placeholder="#{common.telefono}" placeholder="Teléfono">
                            </div>
                            <div class="field">
                                <label class="field-label" for="direccion" th:text="#{common.direccion}">Dirección</label>
                                <input class="input" type="text" id="direccion" name="direccion"
                                    th:value="*{direccion}" th:placeholder="#{common.direccion}" placeholder="Dirección">
                            </div>
                            <div class="field">
                                <label class="field-label" for="especialidad" th:text="#{odontologo.especialidad}">Especialidad</label>
                                <input class="input" type="text" id="especialidad" name="especialidad"
                                    th:value="*{especialidad}" th:placeholder="#{odontologo.placeholder.especialidad}" placeholder="Ej: Ortodoncia, Endodoncia">
                            </div>
                        </div>

                        <div class="nav-section" th:text="#{odontologo.horario}">Horario de atención</div>

                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th th:text="#{common.dia}">Día</th>
                                        <th th:text="#{common.desde}">Desde</th>
                                        <th th:text="#{common.hasta}">Hasta</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="fila, i : *{horarios}">
                                        <td>
                                            <span th:text="${fila.diaSemana}">LUNES</span>
                                            <input type="hidden" th:field="*{horarios[__${i.index}__].id}">
                                            <input type="hidden" th:field="*{horarios[__${i.index}__].diaSemana}">
                                        </td>
                                        <td><input class="input" type="time"
                                            th:field="*{horarios[__${i.index}__].horarioInicio}"></td>
                                        <td><input class="input" type="time"
                                            th:field="*{horarios[__${i.index}__].horarioFin}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <p class="text-muted" th:text="#{odontologo.help.horario}">Deje un día en blanco si no se atiende.</p>

                        <div class="actions mt-24">
                            <button class="btn btn-primary" type="submit"
                                th:text="${odontologo.id == null ? #messages.msg('odontologo.crear') : #messages.msg('common.guardar-cambios')}">
                                Crear Odontólogo
                            </button>
                            <a class="btn btn-ghost" th:href="@{/odontologos}" th:text="#{common.cancelar}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
