<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Odontólogos')}"></head>

<body class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content">
            <h1 class="page-title" th:text="${odontologo.id == null ? 'Alta Odontólogos' : 'Edición de Odontólogo'}">
                Alta Odontólogos</h1>
            <p class="page-subtitle">Complete los datos del odontólogo.</p>

            <div class="panel">
                <div class="panel-body">
                    <form th:object="${odontologo}"
                        th:action="${odontologo.id == null} ? @{/odontologos/nuevo} : @{/odontologos/editar/{id}(id=${odontologo.id})}"
                        method="post">
                        <div class="form-grid">
                            <div class="field">
                                <label class="field-label" for="dni">DNI</label>
                                <input class="input" type="text" id="dni" name="dni"
                                    th:value="*{dni}" placeholder="Ej: 30.123.456" required>
                            </div>
                            <div class="field">
                                <label class="field-label" for="nombre">Nombre</label>
                                <input class="input" type="text" id="nombre" name="nombre"
                                    th:value="*{nombre}" placeholder="Nombre" required>
                            </div>
                            <div class="field">
                                <label class="field-label" for="apellido">Apellido</label>
                                <input class="input" type="text" id="apellido" name="apellido"
                                    th:value="*{apellido}" placeholder="Apellido" required>
                            </div>
                            <div class="field">
                                <label class="field-label" for="telefono">Teléfono</label>
                                <input class="input" type="text" id="telefono" name="telefono"
                                    th:value="*{telefono}" placeholder="Teléfono">
                            </div>
                            <div class="field">
                                <label class="field-label" for="direccion">Dirección</label>
                                <input class="input" type="text" id="direccion" name="direccion"
                                    th:value="*{direccion}" placeholder="Dirección">
                            </div>
                            <div class="field">
                                <label class="field-label" for="especialidad">Especialidad</label>
                                <input class="input" type="text" id="especialidad" name="especialidad"
                                    th:value="*{especialidad}" placeholder="Ej: Ortodoncia, Endodoncia">
                            </div>
                        </div>

                        <div class="actions mt-24">
                            <button class="btn btn-primary" type="submit"
                                th:text="${odontologo.id == null ? 'Crear Odontólogo' : 'Guardar Modificación'}">
                                Crear Odontólogo
                            </button>
                            <a class="btn btn-ghost" th:href="@{/odontologos}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
