<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ver Pacientes')}"></head>

<body class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content">
            <h1 class="page-title">Ver Pacientes</h1>
            <p class="page-subtitle">A continuación podrá visualizar la lista completa de pacientes.</p>

            <div th:if="${error}" class="alert alert-error" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Error</span>
                <button class="alert-close" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Pacientes</h2>
                    <a class="btn btn-primary" th:href="@{/pacientes/nuevo}">
                        <i class="fas fa-plus"></i>
                        Nuevo Paciente
                    </a>
                </div>
                <div class="panel-body">
                    <form class="toolbar" th:action="@{/pacientes}" method="get">
                        <input class="input" type="text" name="busqueda" th:value="${busqueda}"
                            placeholder="Buscar por nombre o apellido">
                        <button class="btn btn-ghost" type="submit">
                            <i class="fas fa-search"></i>
                            Buscar
                        </button>
                    </form>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>DNI</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Teléfono</th>
                                    <th>Obra Social</th>
                                    <th class="text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="paciente : ${pacientes}">
                                    <td th:text="${paciente.id}">1</td>
                                    <td th:text="${paciente.dni}">DNI</td>
                                    <td th:text="${paciente.nombre}">Nombre</td>
                                    <td th:text="${paciente.apellido}">Apellido</td>
                                    <td th:text="${paciente.telefono}">Teléfono</td>
                                    <td>
                                        <span th:if="${paciente.tieneOS}"
                                            th:text="${paciente.nombreOS}">Obra Social</span>
                                        <span th:unless="${paciente.tieneOS}" class="text-muted">—</span>
                                    </td>
                                    <td>
                                        <div class="actions text-right">
                                            <a class="btn-icon btn-icon-edit"
                                                th:href="@{/pacientes/editar/{id}(id=${paciente.id})}"
                                                title="Editar">
                                                <i class="fas fa-pen"></i>
                                            </a>
                                            <form class="inline-form"
                                                th:action="@{/pacientes/eliminar/{id}(id=${paciente.id})}"
                                                method="post"
                                                onsubmit="return confirm('¿Eliminar al paciente?');">
                                                <button class="btn-icon btn-icon-delete" type="submit"
                                                    title="Eliminar">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(pacientes)}" class="empty-row">
                                    <td colspan="6">No hay pacientes registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
