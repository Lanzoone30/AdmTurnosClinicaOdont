<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Error')}"></head>

<body class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content">
            <div class="panel">
                <div class="panel-body">
                    <div class="error-box">
                        <div class="error-code">404</div>
                        <h1 class="error-title">Página no encontrada</h1>
                        <p class="error-text">Parece que la página que busca no existe.</p>
                        <a class="btn btn-primary" th:href="@{/}">
                            <i class="fas fa-arrow-left"></i>
                            Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
