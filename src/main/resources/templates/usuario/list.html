<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${idiomaActual}" lang="es">
<head th:replace="~{fragments/layout :: head(#{usuario.titulo.ver})}"></head>

<body class="app">

    <a class="skip-link" href="#main" th:text="#{a11y.saltar-contenido}">Saltar al contenido principal</a>

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content" id="main">
            <h1 class="page-title" th:text="#{usuario.titulo.ver}">Ver Usuarios</h1>
            <p class="page-subtitle" th:text="#{usuario.subtitulo.ver}">A continuación podrá visualizar la lista completa de usuarios.</p>

            <div th:if="${error}" class="alert alert-error" role="alert">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span th:text="${error}">Error</span>
                <button class="alert-close" type="button" th:aria-label="#{common.cerrar-alerta}" aria-label="Cerrar">&times;</button>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title" th:text="#{nav.usuarios}">Usuarios</h2>
                    <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
                        <i class="fas fa-plus" aria-hidden="true"></i>
                        <span th:text="#{usuario.nuevo}">Nuevo Usuario</span>
                    </a>
                </div>
                <div class="panel-body">
                    <div class="table-wrap" role="region" th:aria-label="#{usuario.listado}" aria-label="Listado de usuarios" tabindex="0">
                        <table class="table">
<caption th:text="#{usuario.listado}">Listado de usuarios</caption>
                            <thead>
                                <tr>
                                    <th scope="col" th:text="#{common.id}">Id</th>
                                    <th scope="col" th:text="#{common.tabla.nombre}">Nombre</th>
                                    <th scope="col" th:text="#{common.tabla.rol}">Rol</th>
                                    <th scope="col" class="text-right" th:text="#{common.tabla.accion}">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usuario : ${usuarios}">
                                    <td th:text="${usuario.id}">1</td>
                                    <td th:text="${usuario.nombreUsuario}">Nombre</td>
                                    <td>
                                        <span class="badge" th:classappend="'badge-' + ${usuario.rol.name().toLowerCase()}"
                                            th:text="${usuario.rol.name()}">Rol</span>
                                    </td>
                                    <td>
                                        <div class="actions text-right">
                                            <a class="btn-icon btn-icon-edit"
                                                th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                                th:title="#{common.editar}" th:aria-label="#{common.editar}" title="Editar" aria-label="Editar">
                                                <i class="fas fa-pen" aria-hidden="true"></i>
                                            </a>
                                            <form class="inline-form"
                                                th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                                                method="post"
                                                th:attr="data-confirm=#{common.confirmar-eliminar-usuario}">
                                                <button class="btn-icon btn-icon-delete" type="submit"
                                                    th:title="#{common.eliminar}" title="Eliminar" th:aria-label="#{common.eliminar}" aria-label="Eliminar">
                                                    <i class="fas fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${usuarios.isEmpty()}" class="empty-state">
                        <i class="fas fa-user-cog empty-icon" aria-hidden="true"></i>
                        <p th:text="#{usuario.sin-registros}">No hay usuarios registrados.</p>
                        <a class="btn btn-primary btn-sm" th:href="@{/usuarios/nuevo}" th:text="#{usuario.alta}">Alta de usuario</a>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
