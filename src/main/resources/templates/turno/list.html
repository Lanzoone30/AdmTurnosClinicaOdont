<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ver Turnos')}"></head>

<body class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content">
            <h1 class="page-title">Ver Turnos</h1>
            <p class="page-subtitle">A continuación podrá visualizar la lista completa de turnos.</p>

            <div th:if="${error}" class="alert alert-error" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Error</span>
                <button class="alert-close" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Turnos</h2>
                    <a class="btn btn-primary" th:href="@{/turnos/nuevo}">
                        <i class="fas fa-plus"></i>
                        Nuevo Turno
                    </a>
                </div>
                <div class="panel-body">
                    <form class="filters" th:action="@{/turnos}" method="get">
                        <div class="field">
                            <label class="field-label" for="afeccion">Buscar por afección</label>
                            <input class="input" type="text" id="afeccion" name="afeccion"
                                th:value="${afeccionFiltro}" placeholder="Ej: Dolor de muelas">
                        </div>
                        <div class="field">
                            <label class="field-label" for="estado">Estado</label>
                            <select class="input" id="estado" name="estado">
                                <option value="">Todos</option>
                                <option th:each="e : ${estados}" th:value="${e.name()}"
                                    th:text="${e.name()}"
                                    th:selected="${estadoFiltro != null and estadoFiltro.name() == e.name()}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-search"></i> Filtrar
                            </button>
                        </div>
                    </form>
                    <div th:if="${turnos.isEmpty()}" class="empty-state">
                        <p>No hay turnos que coincidan con los filtros.</p>
                    </div>
                    <div class="table-wrap" th:unless="${turnos.isEmpty()}">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Afección</th>
                                    <th>Fecha</th>
                                    <th>Hora</th>
                                    <th>Doctor</th>
                                    <th>Paciente</th>
                                    <th>Estado</th>
                                    <th>Nota clínica</th>
                                    <th class="text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="turno : ${turnos}">
                                    <td th:text="${turno.afeccion}">Afección</td>
                                    <td th:text="${#temporals.format(turno.fechaTurno, 'dd/MM/yyyy')}">Fecha</td>
                                    <td th:text="${#temporals.format(turno.horaTurno, 'HH:mm')}">Hora</td>
                                    <td th:text="${turno.odontologo != null ? turno.odontologo.nombre + ' ' + turno.odontologo.apellido : ''}">Doctor</td>
                                    <td th:text="${turno.paciente != null ? turno.paciente.nombre + ' ' + turno.paciente.apellido : ''}">Paciente</td>
                                    <td>
                                        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(turno.estado.name())}"
                                            th:text="${turno.estado.name()}">estado</span>
                                    </td>
                                    <td th:text="${turno.notaClinica != null and !turno.notaClinica.isBlank()} ? ${turno.notaClinica} : '—'">—</td>
                                    <td>
                                        <div class="actions text-right">
                                            <form class="inline-form"
                                                th:if="${turno.estado.name() == 'PENDIENTE'}"
                                                th:action="@{/turnos/{id}/estado(id=${turno.id})}" method="post">
                                                <input type="hidden" name="estado" value="CONFIRMADO">
                                                <button class="btn-icon btn-icon-edit" type="submit" title="Confirmar">
                                                    <i class="fas fa-check"></i>
                                                </button>
                                            </form>
                                            <form class="inline-form"
                                                th:if="${turno.estado.name() == 'CONFIRMADO'}"
                                                th:action="@{/turnos/{id}/estado(id=${turno.id})}" method="post">
                                                <input type="hidden" name="estado" value="REALIZADO">
                                                <input type="hidden" name="motivo" value="">
                                                <button class="btn-icon btn-icon-edit" type="submit"
                                                    title="Marcar realizado (requiere nota clínica)">
                                                    <i class="fas fa-tooth"></i>
                                                </button>
                                            </form>
                                            <form class="inline-form"
                                                th:if="${turno.estado.name() == 'PENDIENTE' or turno.estado.name() == 'CONFIRMADO'}"
                                                th:action="@{/turnos/{id}/estado(id=${turno.id})}" method="post"
                                                data-estado-dialog>
                                                <input type="hidden" name="estado" value="CANCELADO">
                                                <input type="hidden" name="motivo" value="">
                                                <button class="btn-icon btn-icon-delete" type="submit" title="Cancelar">
                                                    <i class="fas fa-ban"></i>
                                                </button>
                                            </form>
                                            <form class="inline-form"
                                                th:if="${turno.estado.name() == 'PENDIENTE' or turno.estado.name() == 'CONFIRMADO'}"
                                                th:action="@{/turnos/{id}/estado(id=${turno.id})}" method="post"
                                                data-estado-dialog>
                                                <input type="hidden" name="estado" value="NO_ASISTIO">
                                                <input type="hidden" name="motivo" value="">
                                                <button class="btn-icon btn-icon-delete" type="submit" title="No asistió">
                                                    <i class="fas fa-user-slash"></i>
                                                </button>
                                            </form>
                                            <a class="btn-icon btn-icon-edit"
                                                th:href="@{/turnos/editar/{id}(id=${turno.id})}"
                                                title="Editar">
                                                <i class="fas fa-pen"></i>
                                            </a>
                                            <form class="inline-form"
                                                th:action="@{/turnos/eliminar/{id}(id=${turno.id})}"
                                                method="post"
                                                data-confirm="¿Eliminar el turno?">
                                                <button class="btn-icon btn-icon-delete" type="submit"
                                                    title="Eliminar">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
