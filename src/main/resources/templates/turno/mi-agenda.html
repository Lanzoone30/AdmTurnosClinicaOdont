<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${idiomaActual}" lang="es">
<head th:replace="~{fragments/layout :: head(#{agenda.titulo})}"></head>

<body class="app">

    <a class="skip-link" href="#main" th:text="#{a11y.saltar-contenido}">Saltar al contenido principal</a>

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content" id="main">
            <h1 class="page-title" th:text="#{agenda.titulo}">Mi Agenda</h1>
            <p class="page-subtitle"><span th:text="#{mis-turnos.turnos-semana}">Turnos de la semana</span>
                (<span th:text="${#temporals.format(desde, 'dd/MM/yyyy')}">desde</span> -
                <span th:text="${#temporals.format(hasta, 'dd/MM/yyyy')}">hasta</span>).</p>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title" th:text="#{agenda.semanal}">Agenda Semanal</h2>
                    <div class="actions">
                        <a class="btn btn-ghost btn-sm"
                            th:href="@{/turnos/mi-agenda(inicio=${desde.minusDays(7)})}">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i> <span th:text="#{agenda.anterior}">Anterior</span>
                        </a>
                        <a class="btn btn-primary btn-sm"
                            th:href="@{/turnos/mi-agenda(inicio=${desde.plusDays(7)})}">
                            <span th:text="#{agenda.siguiente}">Siguiente</span> <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
                <div class="panel-body">
                    <div th:if="${turnos.isEmpty()}" class="empty-state">
                        <i class="fas fa-calendar-times empty-icon" aria-hidden="true"></i>
                        <p th:text="#{agenda.sin-turnos}">No tiene turnos en este periodo.</p>
                    </div>
                    <div class="table-wrap" role="region" th:aria-label="#{agenda.subtitulo}" aria-label="Agenda de turnos del odontólogo" tabindex="0" th:unless="${turnos.isEmpty()}">
                        <table class="table">
<caption th:text="#{agenda.subtitulo}">Agenda de turnos del odontólogo</caption>
                            <thead>
                                <tr>
                                    <th scope="col" th:text="#{turno.fecha}">Fecha</th>
                                    <th scope="col" th:text="#{turno.hora}">Hora</th>
                                    <th scope="col" th:text="#{turno.paciente}">Paciente</th>
                                    <th scope="col" th:text="#{turno.afeccion}">Afección</th>
                                    <th scope="col" th:text="#{turno.estado}">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="turno : ${turnos}">
                                    <td th:text="${#temporals.format(turno.fechaTurno, 'dd/MM/yyyy')}">fecha</td>
                                    <td th:text="${#temporals.format(turno.horaTurno, 'HH:mm')}">hora</td>
                                    <td th:text="${turno.paciente.nombre + ' ' + turno.paciente.apellido}">paciente</td>
                                    <td th:text="${turno.afeccion}">afeccion</td>
                                    <td>
                                        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(turno.estado.name())}"
                                            th:text="${#messages.msg('estado.' + #strings.replace(turno.estado.name().toLowerCase(), '_', '-'))}">estado</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/app.js}" type="module"></script>
</body>
</html>
