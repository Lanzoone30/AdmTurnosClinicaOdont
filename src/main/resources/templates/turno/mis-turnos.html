<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis Turnos')}"></head>

<body class="app">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <main class="app-content">
            <h1 class="page-title">Mis Turnos</h1>
            <p class="page-subtitle">Historial de sus turnos en la clínica.</p>

            <div class="panel">
                <div class="panel-body">
                    <div th:if="${turnos.isEmpty()}" class="empty-state">
                        <p>No tiene turnos registrados.</p>
                    </div>
                    <div class="table-wrap" th:unless="${turnos.isEmpty()}">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Hora</th>
                                    <th>Odontólogo</th>
                                    <th>Afección</th>
                                    <th>Estado</th>
                                    <th>Nota clínica</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="turno : ${turnos}">
                                    <td th:text="${#temporals.format(turno.fechaTurno, 'dd/MM/yyyy')}">fecha</td>
                                    <td th:text="${#temporals.format(turno.horaTurno, 'HH:mm')}">hora</td>
                                    <td th:text="${turno.odontologo.nombre + ' ' + turno.odontologo.apellido}">odontologo</td>
                                    <td th:text="${turno.afeccion}">afeccion</td>
                                    <td>
                                        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(turno.estado.name())}"
                                            th:text="${turno.estado.name()}">estado</span>
                                    </td>
                                    <td th:text="${turno.notaClinica != null and !turno.notaClinica.isBlank()} ? ${turno.notaClinica} : '—'">—</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/app.js}" type="module"></script>
</body>
</html>
